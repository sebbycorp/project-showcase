<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentgateway</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand-row">
        <div class="brand">
          <img
            class="brand-logo"
            src="icons/agw-mark-color.svg"
            width="22"
            height="22"
            alt=""
          />
          <h1>Agentgateway</h1>
        </div>
        <button
          type="button"
          id="tab-settings"
          data-area="settings"
          class="settings-btn"
          aria-label="Settings"
          title="Settings"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
            />
          </svg>
        </button>
      </div>
      <nav class="area-tabs" aria-label="Areas">
        <button type="button" id="tab-chat" data-area="chat" class="is-active">
          Chat
        </button>
        <button type="button" id="tab-scenarios" data-area="scenarios">
          Scenarios
        </button>
        <button type="button" id="tab-cluster" data-area="cluster">
          Cluster
        </button>
      </nav>
    </header>

    <section id="area-chat" class="area is-active">
      <div class="panel">
        <label class="field-label" for="endpoint">Endpoint URL</label>
        <input
          id="endpoint"
          type="url"
          spellcheck="false"
          autocomplete="off"
          placeholder="http://host/v1/chat/completions"
        />
        <div class="model-row">
          <div class="model-field">
            <label class="field-label" for="model">Model</label>
            <input
              id="model"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="gpt-4o-mini"
            />
          </div>
          <button id="test" type="button">Test</button>
        </div>
        <figure
          class="seq"
          id="seq-chat"
          data-mode="via-gw"
          aria-label="Request path"
        >
          <figcaption class="seq-caption" aria-live="polite">
            Client → Agentgateway → OpenAI
          </figcaption>
          <div class="seq-fwd">
            <div class="seq-col">
              <div class="seq-box" data-role="client">Client</div>
            </div>
            <div class="seq-arrow" data-step="1" aria-hidden="true"></div>
            <div class="seq-col" data-slot="gateway">
              <div class="seq-box" data-role="gateway">Agentgateway</div>
            </div>
            <div class="seq-arrow" data-step="2" aria-hidden="true"></div>
            <div class="seq-col">
              <div class="seq-box" data-role="target">OpenAI</div>
            </div>
          </div>
          <div class="seq-back">
            <div class="seq-col"></div>
            <div class="seq-arrow is-back" data-step="4" aria-hidden="true"></div>
            <div class="seq-col" data-slot="gateway"></div>
            <div class="seq-arrow is-back" data-step="3" aria-hidden="true"></div>
            <div class="seq-col"></div>
          </div>
        </figure>
        <div id="test-result" class="result-box" hidden></div>
      </div>

      <main id="log" class="log" aria-live="polite"></main>

      <form id="chat-form" class="composer">
        <textarea
          id="message"
          rows="2"
          placeholder="Message…"
          autocomplete="off"
        ></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </section>

    <section id="area-scenarios" class="area" hidden>
      <div class="panel">
        <label class="field-label" for="scenario-type">Scenario</label>
        <select id="scenario-type">
          <option value="failover">Failover</option>
          <option value="mcp">MCP</option>
          <option value="a2a">A2A</option>
          <option value="security">Security</option>
        </select>

        <div id="scenario-failover" class="scenario is-active">
          <p class="hint" id="failover-endpoint-hint"></p>
          <label class="field-label" for="primary-model">Primary model</label>
          <input
            id="primary-model"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="gpt-4o-mini"
          />
          <label class="field-label" for="fallback-model">Fallback model</label>
          <input
            id="fallback-model"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="gpt-4o"
          />
          <figure
            class="seq"
            id="seq-failover"
            data-mode="via-gw"
            aria-label="Request path"
          >
            <figcaption class="seq-caption" aria-live="polite">
              Client → Agentgateway → OpenAI
            </figcaption>
            <div class="seq-fwd">
              <div class="seq-col">
                <div class="seq-box" data-role="client">Client</div>
              </div>
              <div class="seq-arrow" data-step="1" aria-hidden="true"></div>
              <div class="seq-col" data-slot="gateway">
                <div class="seq-box" data-role="gateway">Agentgateway</div>
              </div>
              <div class="seq-arrow" data-step="2" aria-hidden="true"></div>
              <div class="seq-col">
                <div class="seq-box" data-role="target">OpenAI</div>
              </div>
            </div>
            <div class="seq-back">
              <div class="seq-col"></div>
              <div class="seq-arrow is-back" data-step="4" aria-hidden="true"></div>
              <div class="seq-col" data-slot="gateway"></div>
              <div class="seq-arrow is-back" data-step="3" aria-hidden="true"></div>
              <div class="seq-col"></div>
            </div>
          </figure>
          <button id="run-failover" type="button">Run test</button>
        </div>

        <div id="scenario-mcp" class="scenario" hidden>
          <label class="field-label" for="mcp-endpoint">MCP endpoint</label>
          <input
            id="mcp-endpoint"
            type="url"
            spellcheck="false"
            autocomplete="off"
            placeholder="http://host/mcp"
          />
          <figure
            class="seq"
            id="seq-mcp"
            data-mode="via-gw"
            aria-label="Request path"
          >
            <figcaption class="seq-caption" aria-live="polite">
              Client → Agentgateway → MCP
            </figcaption>
            <div class="seq-fwd">
              <div class="seq-col">
                <div class="seq-box" data-role="client">Client</div>
              </div>
              <div class="seq-arrow" data-step="1" aria-hidden="true"></div>
              <div class="seq-col" data-slot="gateway">
                <div class="seq-box" data-role="gateway">Agentgateway</div>
              </div>
              <div class="seq-arrow" data-step="2" aria-hidden="true"></div>
              <div class="seq-col">
                <div class="seq-box" data-role="target">MCP</div>
              </div>
            </div>
            <div class="seq-back">
              <div class="seq-col"></div>
              <div class="seq-arrow is-back" data-step="4" aria-hidden="true"></div>
              <div class="seq-col" data-slot="gateway"></div>
              <div class="seq-arrow is-back" data-step="3" aria-hidden="true"></div>
              <div class="seq-col"></div>
            </div>
          </figure>
          <button id="probe-mcp" type="button">Probe</button>
        </div>

        <div id="scenario-a2a" class="scenario" hidden>
          <label class="field-label" for="a2a-endpoint">A2A endpoint</label>
          <input
            id="a2a-endpoint"
            type="url"
            spellcheck="false"
            autocomplete="off"
            placeholder="http://host/.well-known/agent-card.json"
          />
          <button id="probe-a2a" type="button">Probe</button>
        </div>

        <div id="scenario-security" class="scenario" hidden>
          <p class="hint" id="security-endpoint-hint"></p>
          <p class="hint">
            Safe connectivity checks only: an unauthenticated ping and a short
            junk prompt. No exploit or jailbreak payloads.
          </p>
          <button id="run-security" type="button">Run checks</button>
        </div>
      </div>

      <div id="scenario-result" class="scenario-result" aria-live="polite"></div>
    </section>

    <section id="area-cluster" class="area" hidden>
      <div class="panel cluster-panel">
        <label class="field-label" for="cluster-type">Cluster type</label>
        <select id="cluster-type">
          <option value="gke">GKE</option>
          <option value="aks">AKS</option>
          <option value="eks">EKS</option>
          <option value="local">Local</option>
        </select>
        <p id="cluster-help" class="hint"></p>

        <label class="field-label" for="cluster-api-server">API server URL</label>
        <input
          id="cluster-api-server"
          type="url"
          spellcheck="false"
          autocomplete="off"
          placeholder="https://kubernetes.example:443"
        />

        <label class="field-label" for="cluster-token">Bearer token</label>
        <input
          id="cluster-token"
          type="password"
          spellcheck="false"
          autocomplete="off"
          placeholder="Paste a token, not an exec kubeconfig"
        />

        <label class="field-label" for="cluster-namespace">Namespace</label>
        <input
          id="cluster-namespace"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="agentgateway-system"
        />

        <label class="field-label" for="cluster-kubeconfig">
          Kubeconfig YAML (optional)
        </label>
        <textarea
          id="cluster-kubeconfig"
          rows="4"
          spellcheck="false"
          autocomplete="off"
          placeholder="Paste kubeconfig to fill server and token"
        ></textarea>
        <button id="parse-kubeconfig" type="button">Parse kubeconfig</button>
        <div id="kubeconfig-result" class="result-box" hidden></div>

        <button id="test-cluster" type="button">Test connection</button>
        <div id="cluster-test-result" class="result-box" hidden></div>

        <h2 class="cluster-heading">CRDs</h2>
        <p class="hint">
          List or apply Gateway API and Agentgateway resources in the namespace
          above. Apply accepts YAML (or JSON) and may contain multiple documents.
        </p>

        <label class="field-label" for="crd-kind">Kind</label>
        <select id="crd-kind">
          <option value="Gateway">Gateway</option>
          <option value="HTTPRoute">HTTPRoute</option>
          <option value="EnterpriseAgentgatewayBackend">
            EnterpriseAgentgatewayBackend
          </option>
          <option value="EnterpriseAgentgatewayPolicy">
            EnterpriseAgentgatewayPolicy
          </option>
        </select>
        <button id="list-crds" type="button">List</button>
        <div id="crd-list-result" class="result-box" hidden></div>

        <label class="field-label" for="crd-yaml">YAML</label>
        <textarea
          id="crd-yaml"
          rows="10"
          spellcheck="false"
          autocomplete="off"
        ></textarea>
        <div class="button-row">
          <button id="load-example" type="button" class="btn-secondary">
            Load example
          </button>
          <button id="apply-crds" type="button">Apply</button>
        </div>
        <div id="crd-apply-result" class="result-box" hidden></div>
      </div>
    </section>

    <section id="area-settings" class="area" hidden>
      <div class="panel">
        <h2 class="cluster-heading">Settings</h2>
        <label class="toggle" for="hooray">
          <input id="hooray" type="checkbox" checked />
          <span class="toggle-ui" aria-hidden="true"></span>
          <span class="toggle-copy">
            <span class="toggle-title">Hooray</span>
            <span class="hint">Confetti on a successful test.</span>
          </span>
        </label>
      </div>
    </section>

    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
    <script src="yaml.js"></script>
    <script src="confetti.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
